{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "outlier.fullname" . }}
  labels:
    {{- include "outlier.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "outlier.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- with .Values.networkPolicy.from }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: helm-test
      ports:
        - port: http
          protocol: TCP
{{- end }}
