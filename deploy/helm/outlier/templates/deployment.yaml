apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "outlier.fullname" . }}
  labels:
    {{- include "outlier.labels" . | nindent 4 }}
spec:
  # SQLite + in-memory party rooms: exactly one pod, and the old one stops before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "outlier.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "outlier.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: outlier
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: TZ
              value: {{ .Values.timeZone | quote }}
            - name: OUTLIER_HISTORY_DAYS
              value: {{ .Values.historyDays | quote }}
            - name: OUTLIER_DATA
              value: /data
            - name: OUTLIER_HOST
              value: 0.0.0.0
            - name: OUTLIER_PORT
              value: "8080"
            {{- with .Values.trustProxy }}
            - name: OUTLIER_TRUST_PROXY
              value: {{ . | quote }}
            {{- end }}
            {{- if or .Values.secureCookies (and .Values.ingress.enabled .Values.ingress.tls.enabled) }}
            - name: OUTLIER_SECURE_COOKIES
              value: "1"
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet: { path: /api/me, port: http }
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /api/me, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/me, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "outlier.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
